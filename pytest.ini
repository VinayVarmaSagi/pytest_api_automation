[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: fast sanity checks that gate every build
    regression: full functional coverage
    negative: invalid input and error-path tests (4xx responses)
    security: auth, token and permission tests
    slow: long-running tests, skipped unless --run-slow is passed
    contract: consumer contract tests

#[pytest] is required in pytest.ini. Without it, none of the below settings are applied.
#testpaths = tests tells pytest where to look when you run bare pytest, so it doesn't crawl client/, builders/ and the other folders. It only applies when you don't pass a path.
#if we pass this, pytest checks for tests from here and runs only those tests after collecting those tests. else it tries to get every file whichever has test_* or *_test, it mistakes other files as test
#passing pytest -m smoke is easy without haviing to pass anything in terminal since we configured test path in testpaths above.
#however explicitly sending the path from terminal will still override the above testpaths ie pytest tests/security/
#addopts = -ra --strict-markers silently adds these flags to every run:
#r is short summary info at the end of run
#a means show all outcomes(failed, error,skipped,xfailed,xpassed) except passed
#-ra prints a summary of all skipped, xfailed, failed, xpassed and errored tests with reasons.
#-ra has to be used together not individualy. -r needs letter after it, a is not pytest flag. The a only means “all except passed” when it comes after -r
#Without -ra, pytest still lists FAILED and ERROR in the summary, because its default is -rfE (f = failed, E = error). -ra adds skipped, xfailed and xpassed on top of those.
#--strict-markers makes any marker not listed under markers a hard error. A typo like @pytest.mark.smoek then fails instead of quietly selecting no test.
#markers = is a multi-line value. The names go on indented lines below it, in name: description format. The descriptions show up in pytest --markers command(these custom markers also shown along with default markers such as skip, xfail, parametrise), and they make the file self-documenting for teammates or an interviewer.
#to run markers pytest -m smoke, to run any test with regex pytest -k credit to run tests with credit in name.