name: Regression Tests

on:
  pull_request:
    branches: [main]            # PRs whose TARGET is main
  schedule:
    - cron: "17 10 * * 0"       # weekly: Sunday 10:17 UTC ≈ 2:17 AM PT
  workflow_dispatch:             # manual "Run workflow" button

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: pytest -m regression -v --html=reports/regression-report.html --self-contained-html

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/
          retention-days: 14

      - name: Email regression report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: dawidd6/action-send-mail@v12
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Regression ${{ job.status }} - ${{ github.repository }}"
          body: |
              Regression run finished: ${{ job.status }}
              Trigger: ${{ github.event_name }} | Branch: ${{ github.ref_name }}
              Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              The HTML report is attached.
          attachments: reports/regression-report.html