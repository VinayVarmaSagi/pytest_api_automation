name: Smoke Tests                      # name shown in the Actions tab

on:                                    # WHEN to run
  push:
    branches: ["**"]                   # every push, to any branch - runs Smoke
  schedule:
    - cron: "17 10 * * 0"     # every sunday at 10hour:17minutes UTC ie 02:17PST
  workflow_dispatch:          # a "Run workflow" button for manual runs

jobs:
  smoke:                               # job id (any name we can provice)
    runs-on: ubuntu-24.04             # a fresh Linux VM GitHub gives us

    steps:
      - name: Check out code
        uses: actions/checkout@v4      # copies our repo onto the VM

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"        # match our local 3.9
          cache: "pip"                 # reuses downloads → faster later runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        env:
          TOKEN: ${{ secrets.TOKEN }}   # uses our token from CI secrets
        run: pytest -m smoke -v --html=reports/smoke-report.html --self-contained-html

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: smoke-report
         path: reports/
         retention-days: 14